name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out && python3 - <<'PY'
          import re,urllib.request,xml.etree.ElementTree as ET
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'}
          x=urllib.request.urlopen(urllib.request.Request('https://medium.com/feed/@rajeeljaved',headers=UA)).read()
          r=ET.fromstring(x);ns={'content':'http://purl.org/rss/1.0/modules/content/'}
          for it in r.iter('item'):
            t=it.findtext('title');c=it.findtext('content:encoded',namespaces=ns) or ''
            imgs=re.findall(r'<img[^>]+src="([^"]+)"',c)
            print('POST',t,len(imgs),[i for i in imgs if 'cdn-images' in i][:3])
            open(re.sub(r'[^a-z0-9]+','-',t.lower()).strip('-')+'.html','w').write(c)
            slug=re.sub(r'[^a-z0-9]+','-',t.lower()).strip('-')
            for k,u in enumerate([i for i in imgs if 'cdn-images' in i][:3]):
              u2=re.sub(r'/max/\d+/','/max/2000/',u)
              try:
                open(f'{slug}-{k}.img','wb').write(urllib.request.urlopen(urllib.request.Request(u2,headers=UA)).read())
              except Exception as e: print('ERR',u2,e)
          PY
      - run: |
          cd out && git init -q && git checkout -q -b medtmp && git add . && git -c user.name=b -c user.email=b@b commit -qm imgs
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" medtmp
