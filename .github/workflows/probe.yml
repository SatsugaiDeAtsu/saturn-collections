name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright -q && python -m playwright install chromium --with-deps >/dev/null 2>&1
      - run: |
          cat > t.py <<'P'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              pg=await b.new_page()
              pg.on('console',lambda m:print('console',m.type,m.text[:300]))
              pg.on('pageerror',lambda e:print('pageerror',str(e)[:300]))
              await pg.goto('https://satsugaideatsu.github.io/saturn-collections/#overview');await pg.wait_for_timeout(6000)
              print(await pg.evaluate("""async()=>{const out={};for(const u of ['/spotify/api/search?q=tame&type=artist&limit=10','/spotify/api/me/player/recently-played?limit=50','/spotify/now']){try{const r=await fetch('https://saturn-mal.vananimestia.workers.dev'+u);out[u]=r.status+' '+(await r.text()).slice(0,80)}catch(e){out[u]='ERR '+e}}return out}"""))
              print(await pg.evaluate("typeof spSearch"))
              print(await pg.inner_text('#ov_music .box-h span') if await pg.query_selector('#ov_music .box-h span') else 'no ov_music')
              await b.close()
          asyncio.run(main())
          P
          python t.py
