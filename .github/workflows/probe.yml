name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://saturn-mal.vananimestia.workers.dev/spotify/api
          for u in "/artists/42pWilgI9MEZARoTtGHNR4/albums?include_groups=album,single&limit=50&offset=0" "/artists/42pWilgI9MEZARoTtGHNR4/albums?include_groups=album,single&limit=10" "/artists/42pWilgI9MEZARoTtGHNR4/albums"; do echo "== $u"; curl -s "$W$u" | head -c 600; echo; done
          A=$(curl -s "$W/artists/42pWilgI9MEZARoTtGHNR4/albums?limit=5" | python3 -c "import sys,json;print(json.load(sys.stdin)['items'][0]['id'])" 2>/dev/null); echo "album $A"; curl -s "$W/albums/$A" | head -c 800
