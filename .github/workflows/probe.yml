name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re,urllib.request,time
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for s in ['underworld','underworld-evolution','underworld-rise-of-the-lycans','underworld-awakening','underworld-blood-wars','tag-2018','tag']:
            for u in [f'https://letterboxd.com/satsugaideatsu/film/{s}/',f'https://letterboxd.com/film/{s}/']:
              try:
                h=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'text/html'}),timeout=30).read().decode()
                t=re.search(r'<title>([^<]*)',h);rt=re.findall(r'rated-(\d+)',h)[:2]
                print('R',u,t and t.group(1)[:80],'watched' if re.search(r'(?i)watched by|>Watched<|film-watched',h) else '',rt, re.search(r'data-tmdb-id="(\d+)"',h) and re.search(r'data-tmdb-id="(\d+)"',h).group(1))
              except Exception as e: print('R',u,e)
              time.sleep(2)
          PY
