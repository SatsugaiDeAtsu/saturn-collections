name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import re,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          h=urllib.request.urlopen(urllib.request.Request('https://letterboxd.com/satsugaideatsu/films/',headers={'User-Agent':UA})).read().decode()
          print('LEN',len(h))
          i=h.find('poster-container');i=i if i>0 else h.find('griditem')
          print(h[i-300:i+2500])
          print('PAGES',re.findall(r'/films/page/(\d+)/',h)[-3:])
          print('COUNT',len(re.findall(r'data-film-slug|data-item-slug',h)))
          PY
