name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - run: |
          python3 - <<'PY'
          import re,time
          from curl_cffi import requests as R
          for u in ['https://letterboxd.com/satsugaideatsu/films/by/date/','https://letterboxd.com/satsugaideatsu/films/by/date/page/2/','https://letterboxd.com/satsugaideatsu/films/page/3/']:
            try:
              r=R.get(u,impersonate='chrome',timeout=30)
              print('CFFI',u,r.status_code, re.findall(r'data-item-full-display-name="([^"]*)"',r.text)[:8])
            except Exception as e: print('CFFI',u,e)
            time.sleep(3)
          import urllib.request
          try:
            h=urllib.request.urlopen(urllib.request.Request('https://r.jina.ai/https://letterboxd.com/satsugaideatsu/films/by/date/',headers={'User-Agent':'x'}),timeout=60).read().decode()
            print('JINA',len(h),h[:600])
          except Exception as e: print('JINA',e)
          PY
