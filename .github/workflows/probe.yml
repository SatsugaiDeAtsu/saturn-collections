name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re,urllib.request,time
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for u in ['https://letterboxd.com/satsugaideatsu/films/by/date/','https://letterboxd.com/satsugaideatsu/films/']:
            try:
              h=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'text/html','Accept-Language':'en-US,en;q=0.9'})).read().decode()
              print(u, re.findall(r'data-item-full-display-name="([^"]*)"',h)[:10])
            except Exception as e: print(u,e)
            time.sleep(3)
          PY
