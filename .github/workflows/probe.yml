    steps:
      - run: |
          for u in https://api.myanimelist.net/v2/anime/1 https://myanimelist.net/ https://api.jikan.moe/v4/anime/1; do echo "== $u"; curl -s -o /dev/null -w "%{http_code}\n" "$u"; done
