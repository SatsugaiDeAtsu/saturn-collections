name: MAL sync
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q cryptography
      - id: s
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          MAL_SYNC_KEY: ${{ secrets.MAL_SYNC_KEY }}
        run: python scripts/mal_sync.py
      - name: Save
        run: |
          git config user.name "saturn-bot"; git config user.email "saturn-bot@users.noreply.github.com"
          git add data/mal_queue.json data/mal_sync.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "MAL sync" && git pull --rebase -q && git push -q)
      - name: Refresh the site after syncing
        if: steps.s.outputs.synced != '' && steps.s.outputs.synced != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
