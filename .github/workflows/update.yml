name: Daily update

on:
  schedule:
    - cron: '17 21 * * *'   # 02:17 Pakistan time, every day
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths:
      - 'data/imports/**'    # re-run whenever you upload a new export
      - 'data/mal_touch.json' # re-run right after you edit MAL from the site

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Picture tools
        run: pip install --quiet pillow || true
      - name: Refresh data
        run: python scripts/update.py
      - name: Save changes
        run: |
          git config user.name "saturn-collections-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/site.json data/hof.json data/hof_cache.json data/book_covers.json data/game_covers.json data/game_meta.json data/char_info.json covers
          git diff --cached --quiet || git commit -m "Daily data update"
          git pull --rebase origin main
          git push
