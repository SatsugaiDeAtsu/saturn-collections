<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturn Collections</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c0e22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2f6;--panel:#ffffff;--panel2:#faf7fa;--line:#e6dee8;--line2:#d2c6d6;
  --ink:#1d1420;--ink2:#54485a;--ink3:#93879a;
  --bar:#1c0e22;--bar2:#2d1638;--barInk:#f2e9f5;
  --accent:#b8264a;--accentSoft:#f8e6ec;
  --anime:#7a3fd1;--manga:#c8324f;--film:#e2672b;--game:#1f9a8a;--book:#a8722f;--story:#c2457e;--gold:#d9a514;
  --s1:#2db039;--s2:#6a35c2;--s3:#e8b923;--s4:#a12f31;--s6:#b4b8c2;
  --gap:16px;
}
:root[data-theme=dark]{
  --bg:#120b15;--panel:#1b1220;--panel2:#22172a;--line:#33253b;--line2:#45334f;
  --ink:#f0e9f2;--ink2:#b9abc0;--ink3:#7e6f88;
  --bar:#0c060f;--bar2:#1a0e20;--barInk:#f2e9f5;
  --accent:#ee5a7e;--accentSoft:#3a1424;
  --anime:#a77ef0;--manga:#f06f88;--film:#f08a50;--game:#3cc5b2;--book:#d4a062;--story:#ec7ab0;--gold:#f0c43c;
  --s2:#9a6ae6;--s6:#6a5a72;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}

/* top bar */
.top{background:var(--bar);color:var(--barInk);position:sticky;top:0;z-index:20;border-bottom:1px solid #000}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;white-space:nowrap;letter-spacing:.02em}
.brand span:last-child{background:linear-gradient(90deg,#fff,#ffc2d2 60%,#c9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#logo{display:grid;place-items:center}
.brand svg{flex:none}
.gsearch{flex:1;display:flex;max-width:520px;margin-left:auto;min-width:0}
.gsearch input{flex:1;min-width:0;background:var(--bar2);border:1px solid #4a2a58;border-right:0;color:#fff;padding:8px 12px;outline:none}
.gsearch input::placeholder{color:#a58fb0}
.gsearch input:focus{border-color:#ee5a7e}
.gsearch button{background:#b8264a;border:1px solid #b8264a;color:#fff;padding:0 14px;cursor:pointer;font-weight:600}
.iconbtn{background:transparent;border:1px solid #4a2a58;color:var(--barInk);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover,.gsearch button:hover{filter:brightness(1.15)}
.nav{background:var(--bar2);border-top:1px solid #000}
.nav-in{max-width:1240px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{padding:10px 18px;color:#c3aecb;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.nav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav a.on{color:#fff;border-bottom-color:var(--c,#6f8fe0);background:rgba(255,255,255,.06)}
.nav .dot{width:8px;height:8px;background:var(--c)}

main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.box{background:var(--panel);border:1px solid var(--line)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.box-h h2,.box-h h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink2)}
.box-b{padding:14px}
.grid{display:grid;gap:var(--gap)}
.muted{color:var(--ink3)}
.small{font-size:12px}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.btn{background:var(--panel);border:1px solid var(--line2);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:3px 8px;font-size:12px;font-weight:500;color:var(--ink2);background:var(--panel)}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:1px 6px;font-size:11px;color:var(--ink2);margin:0 4px 4px 0}

/* profile */
.prof{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px}
.avatar{width:84px;height:84px;background:var(--bar);display:grid;place-items:center;border:1px solid var(--line)}
.prof h1{font-size:26px;line-height:1.1}
.prof .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prof .links a:hover{border-color:var(--ink3);color:var(--ink)}

/* stats */
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{border-top:3px solid var(--c);padding:14px;cursor:pointer;transition:border-color .15s}
.stat:hover{background:var(--panel2)}
.stat .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between}
.stat .num{font-family:"Space Grotesk";font-size:34px;font-weight:700;line-height:1.1;margin:6px 0 2px}
.stat .sub{font-size:12px;color:var(--ink2)}
.sbar{display:flex;height:10px;margin:12px 0 8px;background:var(--panel2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:8px;height:8px;display:inline-block}

.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.act{display:flex;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.act:last-child{border-bottom:0}
.act:hover{background:var(--panel2)}
.act .k{width:4px;align-self:stretch;background:var(--c)}
.act .t{flex:1;min-width:0}
.act .t div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .w{font-size:12px;color:var(--ink3);white-space:nowrap}

.dist{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;align-items:end;height:90px}
.dist div{background:var(--c);opacity:.85;position:relative;min-height:2px}
.dist div:hover{opacity:1}
.distl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;font-size:10px;color:var(--ink3);text-align:center;margin-top:4px}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin-bottom:6px}
.hbar .tr{height:12px;background:var(--panel2)}
.hbar .tr i{display:block;height:100%;background:var(--c)}

/* covers / tiles */
.cover{position:relative;aspect-ratio:2/3;background:var(--tc,#334);overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ini{font-family:"Space Grotesk";font-weight:700;font-size:30px;line-height:1;opacity:.9}
.cover .ct{font-size:11px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;opacity:.92}
.cover::after{content:"";position:absolute;inset:0;border:1px solid rgba(0,0,0,.15);pointer-events:none}
.mini{width:42px;flex:none;padding:4px}
.mini .ini{font-size:15px}.mini .ct{display:none}

.favs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.card:hover{border-color:var(--ink3)}
.card .meta{padding:7px 8px;border-top:1px solid var(--line)}
.card .meta .tt{font-weight:600;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .meta .ss{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.badge{position:absolute;top:0;right:0;background:var(--bar);color:#fff;font-family:"JetBrains Mono";font-size:12px;padding:3px 7px;z-index:2}
.sline{position:absolute;left:0;bottom:0;right:0;height:4px;background:var(--sc);z-index:2}

/* list page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:28px;display:flex;align-items:center;gap:10px}
.ph h1 i{width:14px;height:14px;background:var(--c);display:inline-block}
.tabs{display:flex;border:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button .n{font-family:"JetBrains Mono";font-size:11px;color:var(--ink3)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c);background:var(--panel2)}
.tabs button:hover{color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--line);border-top:0;background:var(--panel2)}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line2);padding:7px 10px;outline:none}
.toolbar input{flex:1;min-width:160px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{border:0;background:var(--panel);padding:7px 10px;cursor:pointer;color:var(--ink3);display:grid;place-items:center}
.seg button.on{background:var(--ink);color:var(--panel)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
table.lt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);margin-top:14px}
.lt th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);text-align:left;padding:9px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.lt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.lt tr{cursor:pointer}
.lt tbody tr:hover{background:var(--panel2)}
.lt td.st{width:5px;padding:0;background:var(--sc)}
.lt td.num{font-family:"JetBrains Mono";font-size:12px;color:var(--ink3);width:40px}
.lt td.sc{font-family:"JetBrains Mono";font-weight:500;text-align:center;width:64px}
.lt .ti{font-weight:600}
.lt .alt{font-size:12px;color:var(--ink3)}
.lt td.c{text-align:center;white-space:nowrap}
.more{display:flex;justify-content:center;margin-top:16px}
.empty{padding:40px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);margin-top:14px}
.stars{color:var(--film);letter-spacing:1px;white-space:nowrap}

/* stories */
.story{display:grid;grid-template-columns:6px 1fr;border:1px solid var(--line);background:var(--panel)}
.story .k{background:var(--story)}
.story .in{padding:16px 18px}
.story h3{font-size:19px;margin-bottom:6px}
.story p{color:var(--ink2);margin-bottom:10px}
.story .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--ink3)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,8,15,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.ov.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);width:100%;max-width:760px;position:relative}
.modal .mh{display:flex;justify-content:space-between;align-items:center;background:var(--bar);color:#fff;padding:10px 14px}
.modal .mh span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;display:flex;gap:8px;align-items:center}
.modal .mh button{background:none;border:1px solid #4a2a58;color:#fff;width:30px;height:30px;cursor:pointer}
.mb{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:18px}
.mb h2{font-size:24px;line-height:1.15}
.kv{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line);margin-top:12px}
.kv div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv div:nth-child(odd){color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:8px}
.review{margin-top:14px;border-left:3px solid var(--c);padding:10px 14px;background:var(--panel2);white-space:pre-wrap;font-size:13.5px;color:var(--ink2)}
.bigscore{display:flex;gap:8px;margin-top:12px}
.bigscore div{border:1px solid var(--line);padding:8px 12px;text-align:center;min-width:90px}
.bigscore b{display:block;font-family:"Space Grotesk";font-size:24px}
.bigscore small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700}

/* search */
.sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:12px}
.xr{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);padding:10px;cursor:pointer}
.xr:hover{border-color:var(--ink3)}
.xr .tt{font-weight:600;line-height:1.3}
.xr p{font-size:12px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.own{display:inline-block;background:var(--s1);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;margin-left:4px}
.note{font-size:12px;color:var(--ink3);margin-top:10px;border:1px solid var(--line);padding:8px 10px;background:var(--panel2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.sect{margin-top:22px}
.sect>h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sect>h2 i{width:10px;height:10px;background:var(--c);display:inline-block}

.hof-hero{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:20px;border-top:3px solid #e8b923}
.hof-hero h1{font-size:30px;margin-bottom:8px}
.hof-hero p{color:var(--ink2);margin-bottom:10px;max-width:820px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.jump a{border:1px solid var(--line2);padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--panel)}
.jump a:hover{border-color:var(--ink3);color:var(--ink)}
.hsec{margin-top:16px;scroll-margin-top:110px}
.hsec .box-h{border-top:3px solid var(--c)}
.hsec .desc{color:var(--ink2);font-size:13px;padding:10px 14px 0}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.hgrid .card .meta .tt{font-size:12px}
.couples{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.couple{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.couple .pair{display:grid;grid-template-columns:1fr 1fr}
.couple .pair .cover{aspect-ratio:3/4}
.couple .meta{padding:8px 10px;border-top:1px solid var(--line)}
.couple .meta b{display:block;font-size:13px}
.couple .meta span{font-size:11px;color:var(--ink3)}
.moments{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.moment{border:1px solid var(--line);border-left:4px solid var(--anime);background:var(--panel);padding:10px 12px}
.moment b{display:block;margin-bottom:4px}
.moment li{font-size:13px;color:var(--ink2);margin-left:16px}
.segtabs{display:flex;border:1px solid var(--line);background:var(--panel);margin-top:16px}
.segtabs button{flex:1;border:0;background:none;padding:12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
.segtabs button i{width:9px;height:9px;background:var(--c);display:inline-block}
.segtabs button.on{color:var(--ink);border-bottom-color:var(--c);background:var(--panel2)}
.hated .card{border-color:color-mix(in srgb,var(--s4) 40%,var(--line))}
@media (max-width:640px){.hof-hero{grid-template-columns:1fr}.hgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.segtabs button{padding:10px 4px;font-size:11px}}

.ico{display:inline-block;width:1em;height:1em;vertical-align:-.15em;flex:none}
.nav a .ico{width:15px;height:15px;color:var(--c)}
.banner{position:relative;overflow:hidden;background:var(--bar);color:#fff;border:1px solid #000;margin-bottom:14px;min-height:200px;display:flex;align-items:center}
.banner .bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner .in{position:relative;padding:22px 360px 22px 24px;display:flex;gap:18px;align-items:center;width:100%;flex-wrap:wrap}
.banner .bico{width:64px;height:64px;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.banner .bico .ico{width:36px;height:36px;color:#fff}
.banner h1{font-size:32px;line-height:1.05;color:#fff}
.banner .kick{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--c2,#c9d3ee);opacity:.9}
.banner .sub{font-size:13px;color:#cdb9d4;margin-top:4px}
.banner .bst{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;margin-left:82px}
.banner .bst span{background:rgba(12,6,15,.55);border:1px solid rgba(255,255,255,.18);padding:6px 10px;font-size:12px;color:#dfe5f5}
.banner .bst b{font-family:"Space Grotesk";font-size:16px;margin-right:4px;color:#fff}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px);pointer-events:none}
.cover .ring{position:absolute;right:-18%;bottom:-8%;width:78%;opacity:.22;pointer-events:none}
.mini .ring{display:none}
.stat .ic{width:30px;height:30px;background:var(--c);display:grid;place-items:center;float:right;margin:-2px 0 0 8px}
.stat .ic .ico{width:18px;height:18px;color:#fff}
.grp{margin-top:26px;position:relative;background:var(--bar);color:#fff;padding:16px 18px;display:flex;gap:14px;align-items:center;border-left:6px solid var(--c);overflow:hidden;scroll-margin-top:110px}
.grp .gi{width:44px;height:44px;background:var(--c);display:grid;place-items:center;flex:none}
.grp .gi .ico{width:26px;height:26px;color:#fff}
.grp h2{font-size:21px;color:#fff}
.grp p{font-size:12.5px;color:#cdb9d4;margin-top:2px}
.grp a{margin-left:auto;font-size:12px;color:#fff;border:1px solid rgba(255,255,255,.3);padding:5px 10px;white-space:nowrap}
.grp .bg{position:absolute;right:0;top:0;bottom:0;width:260px;opacity:.5;pointer-events:none}
.jgroups{display:grid;gap:6px;margin:14px 0 4px}
.jg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);background:var(--panel);padding:6px;border-left:5px solid var(--c)}
.jg .jl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink);padding:4px 8px;background:var(--panel2);display:flex;gap:6px;align-items:center;cursor:pointer;border:1px solid var(--line)}
.jg .jl .ico{width:13px;height:13px;color:var(--c)}
.jg a{border:1px solid var(--line2);padding:3px 9px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--panel)}
.jg a:hover{border-color:var(--c);color:var(--ink)}
.book .cover{aspect-ratio:2/3}

function cover(title,img,extra,cls){

}

  const rd=books.filter(b=>b.st==='read');
  listPage({key:'books',title:'Books',sub:`From Goodreads · exported ${fdate(D.generated)}`,
    bst:()=>[[rd.length,'read'],[fmt(rd.reduce((s,b)=>s+b.p,0)),'pages'],[books.filter(b=>b.ur).length,'Urdu']],
    items:()=>books,
    tabs:[['all','All books',()=>true],['read','Read',b=>b.st==='read'],['reading','Reading',b=>b.st==='reading'],['toread','Want to read',b=>b.st==='toread'],['dnf','Did not finish',b=>b.st==='dnf'],['hold','On hold',b=>b.st==='hold']],
    sorts:[['rating','Your rating'],['title','Title'],['author','Author'],['year','Year (newest)'],['pages','Pages']],
    extra:S=>`<select id="lshelf" aria-label="Shelf"><option value="">All shelves</option>${shelves.map(t=>`<option ${S.shelf===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`,
    bindExtra:(S,body)=>{$('#lshelf').onchange=e=>{S.shelf=e.target.value;body()}},
    xfilter:(b,S)=>!S.shelf||b.sh.includes(S.shelf),
    sorter:k=>({rating:(a,b)=>b.r-a.r,title:cmpT,author:(a,b)=>a.a.localeCompare(b.a),year:(a,b)=>b.y-a.y,pages:(a,b)=>b.p-a.p})[k],
    card:(b,i)=>`<div class="card book" data-i="${i}">${cover(b.t,b.img||'',(b.r?`<span class="badge">${b.r}★</span>`:'')+`<span class="sline" style="--sc:${BST[b.st][1]}"></span>`)}<div class="meta"><div class="tt">${esc(b.t)}</div><div class="ss"><span>${esc(b.a)}</span></div></div></div>`,
    thead:'<th style="width:5px;padding:0"></th><th class="hm">#</th><th></th><th>Book</th><th>Rating</th><th>Status</th><th class="hm" style="text-align:center">Pages</th>',
    row:(b,i)=>`<tr data-i="${i}"><td class="st" style="--sc:${BST[b.st][1]}"></td><td class="num hm">${i+1}</td><td style="width:54px">${cover(b.t,'','','mini')}</td><td><div class="ti">${esc(b.t)}</div><div class="alt">${esc(b.a)}${b.ur?` · <span class="urdu">${esc(b.ur)}</span>`:''}</div></td><td><span class="stars" style="color:var(--book)">${bstars(b.r)}</span></td><td class="small">${BST[b.st][0]}</td><td class="c mono small hm">${b.p||''}</td></tr>`,
    open:openBook});

function openBook(b){
  modal('books','Book',`${cover(b.t,b.img||'')}<div><h2>${esc(b.t)}</h2>${b.ur?`<div class="urdu" style="font-size:18px">${esc(b.ur)}</div>`:''}<div class="muted">${esc(b.a)}</div>

const REPO='SatsugaiDeAtsu/saturn-collections';
const ED={get token(){return store.get('gh_token','')},set token(v){store.set('gh_token',v)},get on(){return !!store.get('edit_on',false)&&!!this.token},set on(v){store.set('edit_on',!!v)}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function ghSave(path,obj,msg){
  const api=`https://api.github.com/repos/${REPO}/contents/${path}`;
  const h={Authorization:'Bearer '+ED.token,Accept:'application/vnd.github+json'};
  const cur=await fetch(api+'?ref=main',{headers:h,cache:'no-store'});
  if(cur.status===401||cur.status===403)throw new Error('GitHub refused the token. Check that it has Contents: read and write for saturn-collections.');
  const sha=cur.ok?(await cur.json()).sha:undefined;
  const r=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify({message:msg,content:b64(JSON.stringify(obj,null,0)),sha,branch:'main'})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('GitHub error '+r.status))}
}

/* ---------- MAL connection (through the Cloudflare helper) ---------- */
const SITE_URL='https://satsugaideatsu.github.io/saturn-collections/';
const MALA={get t(){return store.get('mal_auth',null)},set t(v){store.set('mal_auth',v)},get on(){return !!(this.t&&this.t.refresh_token)}};
function malConnect(){
  const v=Array.from(crypto.getRandomValues(new Uint8Array(48)),b=>('0'+b.toString(16)).slice(-2)).join('').slice(0,96);
  const st=Math.random().toString(36).slice(2);store.set('mal_pkce',{v,st});
  location.href=`https://myanimelist.net/v1/oauth2/authorize?response_type=code&client_id=${SET.malClientId}&code_challenge=${v}&code_challenge_method=plain&state=${st}&redirect_uri=${encodeURIComponent(SITE_URL)}`;
}
async function malFinish(){
  const p=new URLSearchParams(location.search);const code=p.get('code'),st=p.get('state');if(!code)return;
  history.replaceState(null,'',location.pathname+location.hash);
  const pk=store.get('mal_pkce',null);if(!pk||pk.st!==st){toast('MAL sign-in expired. Try again.',true);return}
  try{const r=await fetch(SET.workerUrl+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,code_verifier:pk.v,redirect_uri:SITE_URL})});const j=await r.json();
    if(!r.ok||!j.access_token)throw new Error(j.message||j.error||'MAL said no');MALA.t={...j,exp:Date.now()+(j.expires_in-60)*1000};toast('MyAnimeList connected')}
  catch(e){toast('MAL sign-in failed: '+e.message,true)}
}
async function malToken(){const a=MALA.t;if(!a)throw new Error('Connect MAL first (pencil button).');if(Date.now()<a.exp)return a.access_token;
  const r=await fetch(SET.workerUrl+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:a.refresh_token})});const j=await r.json();
  if(!r.ok||!j.access_token){MALA.t=null;throw new Error('MAL sign-in expired. Connect again.')}MALA.t={...j,exp:Date.now()+(j.expires_in-60)*1000};return j.access_token}
async function malSave(kind,id,body,del){
  const tok=await malToken();
  const r=await fetch(`${SET.workerUrl}/list/${kind}/${id}`,{method:del?'DELETE':'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:del?undefined:JSON.stringify(body)});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||j.error||('MAL error '+r.status))}
  if(ED.token){ghSave('data/mal_touch.json',{t:Date.now()},'Refresh after MAL edit').catch(()=>{})}
}

function listPage(cfg){

function localHits(q){
  const n=norm(q);if(!n)return{anime:[],manga:[],films:[],games:[],books:[],stories:[]};
  const words=n.split(' ');
  const m=s=>words.every(w=>s.includes(w));
  return{anime:anime.filter(a=>m(a.n)),manga:manga.filter(x=>m(x.n)),films:films.filter(f=>m(f.n)),games:games.filter(g=>m(g.n)),books:books.filter(b=>m(b.n)),stories:stories.filter(s=>m(norm(s.title+' '+s.tags.join(' ')+' '+s.blurb)))};
}
function ownMatch(kind,title,year){
  const n=norm(title);
  if(kind==='anime')return anime.find(a=>norm(a.t)===n||(a.alt&&norm(a.alt)===n));
  if(kind==='films')return films.find(f=>f.n===n&&(!year||!f.y||Math.abs(f.y-year)<=1));
  if(kind==='games')return games.find(g=>norm(g.t)===n);
  if(kind==='manga')return manga.find(x=>norm(x.t)===n||(x.alt&&norm(x.alt)===n));
  if(kind==='books')return books.find(b=>norm(b.t)===n||norm(b.t).startsWith(n+' '));
}

    S.res[key]=res;if(state.search.ext===kind&&state.search.q===q)showExt(res,kind,q);
  }catch(e){
    const msg=e&&e.code==='not_granted'?'Search with Claude was not allowed on this page.':e&&e.code==='rate_limited'?'Too many searches for now. Try again in a minute.':'Search failed. Try again.';
    box.innerHTML=`<div class="muted">${esc(msg)}</div><div style="margin-top:10px"><button class="btn" id="xretry">Retry</button></div>${outLinks(kind,q)}`;
    const b=$('#xretry');if(b)b.onclick=extSearch;
  }
}
function outLinks(kind,q){return `<div class="note">Also search on <a class="link" href="${OUT[kind](q)}" target="_blank" rel="noopener">${OUTN[kind]} ↗</a></div>`}
function showExt(res,kind,q){
  const box=$('#xbody');
  if(!res.length){box.innerHTML=`<div class="muted">No ${MED[kind].name.toLowerCase()} found for “${esc(q)}”.</div>${outLinks(kind,q)}`;return}
  box.innerHTML=`<div class="sres" style="margin-top:0">${res.map((r,i)=>{const own=ownMatch(kind,r.t,+r.y);return `<div class="xr" data-r="${i}">${cover(r.t,r.img)}<div><div class="tt">${esc(r.t)}${own?'<span class="own">In your list</span>':''}</div>${r.alt?`<div class="small muted">${esc(r.alt)}</div>`:''}<div class="small muted">${esc([r.y,r.meta].filter(Boolean).join(' · '))}</div><p>${esc(r.sum)}</p></div></div>`}).join('')}</div>
  ${mode==='claude'?'<div class="note">These results come from Claude\'s knowledge, so very new releases may be missing. Open one to jump to it on '+OUTN[kind]+'.</div>':''}${outLinks(kind,q)}`;
  box.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{const r=res[+el.dataset.r];const own=ownMatch(kind,r.t,+r.y);if(own){({anime:openAnime,manga:openManga,books:openBook,films:openFilm,games:openGame})[kind](own);return}openExt(kind,r)});
}
function openExt(kind,r){
  setTimeout(()=>{const b=$('#x_add');if(b)b.onclick=()=>editMal(kind,{malId:r.malId,t:r.t,eps:0,chs:0})},0);
  const label={anime:'Anime',manga:'Manga',books:'Book',films:'Film',games:'Game'}[kind];
  modal(kind,label+' · not in your list',`${cover(r.t,r.img)}<div><h2>${esc(r.t)} <span class="muted" style="font-weight:500">${esc(r.y)}</span></h2>${r.alt?`<div class="muted">${esc(r.alt)}</div>`:''}
  <div class="kv">${r.meta?`<div>Details</div><div>${esc(r.meta)}</div>`:''}${r.g&&r.g.length?`<div>Genres</div><div>${r.g.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:''}</div>
  ${r.sum?`<div class="review" style="--c:${MED[kind].c}">${esc(r.sum)}</div>`:''}
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${ED.on&&r.malId&&(kind==='anime'||kind==='manga')?'<button class="btn pri" id="x_add">+ Add to my list</button>':''}<a class="btn${ED.on&&r.malId?'':' pri'}" href="${r.url&&r.malId?r.url:OUT[kind](r.t)}" target="_blank" rel="noopener">${r.malId?'Open on MyAnimeList':'Find on '+OUTN[kind]} ↗</a>${r.url?`<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Source ↗</a>`:''}</div></div>`);
}

$('#foot').innerHTML=`Saturn Collections · data from MyAnimeList, Letterboxd, Grouvee and Medium · last refreshed ${fdate(D.generated)}`;
syncEditBtn();
malFinish();
go();
})();
</script>
