<style>
:root{
  --bg:#f5f2f6;--panel:#ffffff;--panel2:#faf7fa;--line:#e6dee8;--line2:#d2c6d6;
  --ink:#1d1420;--ink2:#54485a;--ink3:#93879a;
  --bar:#1c0e22;--bar2:#2d1638;--barInk:#f2e9f5;
  --accent:#b8264a;--accentSoft:#f8e6ec;
  --anime:#7a3fd1;--manga:#c8324f;--film:#e2672b;--game:#1f9a8a;--book:#a8722f;--story:#c2457e;--gold:#d9a514;
  --s1:#2db039;--s2:#6a35c2;--s3:#e8b923;--s4:#a12f31;--s6:#b4b8c2;
  --gap:16px;
}
:root[data-theme=dark]{
  --bg:#120b15;--panel:#1b1220;--panel2:#22172a;--line:#33253b;--line2:#45334f;
  --ink:#f0e9f2;--ink2:#b9abc0;--ink3:#7e6f88;
  --bar:#0c060f;--bar2:#1a0e20;--barInk:#f2e9f5;
  --accent:#ee5a7e;--accentSoft:#3a1424;
  --anime:#a77ef0;--manga:#f06f88;--film:#f08a50;--game:#3cc5b2;--book:#d4a062;--story:#ec7ab0;--gold:#f0c43c;
  --s2:#9a6ae6;--s6:#6a5a72;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}

/* top bar */
.top{background:var(--bar);color:var(--barInk);position:sticky;top:0;z-index:20;border-bottom:1px solid #000}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;white-space:nowrap;letter-spacing:.02em}
.brand span:last-child{background:linear-gradient(90deg,#fff,#ffc2d2 60%,#c9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#logo{display:grid;place-items:center}
.brand svg{flex:none}
.gsearch{flex:1;display:flex;max-width:520px;margin-left:auto;min-width:0}
.gsearch input{flex:1;min-width:0;background:var(--bar2);border:1px solid #4a2a58;border-right:0;color:#fff;padding:8px 12px;outline:none}
.gsearch input::placeholder{color:#a58fb0}
.gsearch input:focus{border-color:#ee5a7e}
.gsearch button{background:#b8264a;border:1px solid #b8264a;color:#fff;padding:0 14px;cursor:pointer;font-weight:600}
.iconbtn{background:transparent;border:1px solid #4a2a58;color:var(--barInk);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover,.gsearch button:hover{filter:brightness(1.15)}
.nav{background:var(--bar2);border-top:1px solid #000}
.nav-in{max-width:1240px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{padding:10px 18px;color:#c3aecb;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.nav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav a.on{color:#fff;border-bottom-color:var(--c,#6f8fe0);background:rgba(255,255,255,.06)}
.nav .dot{width:8px;height:8px;background:var(--c)}

main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.box{background:var(--panel);border:1px solid var(--line)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.box-h h2,.box-h h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink2)}
.box-b{padding:14px}
.grid{display:grid;gap:var(--gap)}
.muted{color:var(--ink3)}
.small{font-size:12px}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.btn{background:var(--panel);border:1px solid var(--line2);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:3px 8px;font-size:12px;font-weight:500;color:var(--ink2);background:var(--panel)}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:1px 6px;font-size:11px;color:var(--ink2);margin:0 4px 4px 0}

/* profile */
.prof{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px}
.avatar{width:84px;height:84px;background:var(--bar);display:grid;place-items:center;border:1px solid var(--line)}
.prof h1{font-size:26px;line-height:1.1}
.prof .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prof .links a:hover{border-color:var(--ink3);color:var(--ink)}

/* stats */
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{border-top:3px solid var(--c);padding:14px;cursor:pointer;transition:border-color .15s}
.stat:hover{background:var(--panel2)}
.stat .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stat .lab span:last-child{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);padding:1px 6px;color:var(--ink2);letter-spacing:.04em}.stat .lab span:last-child:empty{display:none}
.stat .num{font-family:"Space Grotesk";font-size:34px;font-weight:700;line-height:1.1;margin:6px 0 2px}
.stat .sub{font-size:12px;color:var(--ink2)}
.sbar{display:flex;height:10px;margin:12px 0 8px;background:var(--panel2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:8px;height:8px;display:inline-block}
.legend .lx b{background:none;border:2px solid;width:9px;height:9px}

.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.act{display:flex;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.act:last-child{border-bottom:0}
.act:hover{background:var(--panel2)}
.act .k{width:4px;align-self:stretch;background:var(--c)}
.act .t{flex:1;min-width:0}
.act .t div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .w{font-size:12px;color:var(--ink3);white-space:nowrap}

.dist{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;align-items:end;height:90px}
#ov_sc .dist{height:170px;gap:4px}
.ovgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.ovgrid>.box{display:flex;flex-direction:column;min-width:0}
.ovgrid .hbar{grid-template-columns:96px 1fr 30px}
.ovgrid .hbars{max-height:220px;overflow-y:auto;scrollbar-width:thin;padding-right:4px}
@media (min-width:641px){.ovgrid>.box{height:330px}.ovgrid>.box>.box-b{flex:1;min-height:0;display:flex;flex-direction:column}
  #ov_sc>div:last-child{flex:1;display:flex;flex-direction:column;min-height:0}#ov_sc .dist{flex:1;height:auto;min-height:120px}.ovgrid .hbars{flex:1;max-height:none;min-height:0}.ovair .unl{max-height:none;overflow-y:auto;display:block}}
.ovgrid .box-h{flex-wrap:wrap;row-gap:6px}.ovgrid .box-h h3{white-space:nowrap}.ovgrid .mtabs button{padding:3px 5px}
.ovair .unl{max-height:240px;overflow-y:auto;scrollbar-width:thin;padding-right:4px}
@media (max-width:1000px){.ovgrid{grid-template-columns:1fr 1fr}.ovgrid>.ovair{grid-column:1/-1}}
@media (max-width:640px){.ovgrid{grid-template-columns:minmax(0,1fr)}}
.dist div{background:var(--c);opacity:.85;position:relative;min-height:2px}
.dist div:hover{opacity:1}
.distl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;font-size:10px;color:var(--ink3);text-align:center;margin-top:4px}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin-bottom:6px}
.hbar .tr{height:12px;background:var(--panel2)}
.hbar .tr i{display:block;height:100%;background:var(--c)}

/* covers / tiles */
.cover{position:relative;aspect-ratio:2/3;background:var(--tc,#334);overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ini{font-family:"Space Grotesk";font-weight:700;font-size:30px;line-height:1;opacity:.9}
.cover .ct{font-size:11px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;opacity:.92}
.cover::after{content:"";position:absolute;inset:0;border:1px solid rgba(0,0,0,.15);pointer-events:none}
.mini{width:42px;flex:none;padding:4px}
.mini .ini{font-size:15px}.mini .ct{display:none}

.favs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.favadd{border:2px dashed var(--line2);background:var(--panel2);color:var(--ink3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:160px;font:inherit}
.favadd span{font-size:40px;line-height:1;font-weight:300}.favadd small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.favadd:hover{border-color:var(--c);color:var(--c)}
.favx{position:absolute;top:5px;left:5px;z-index:4;border:0;background:rgba(10,4,14,.75);color:#fff;font-size:11px;padding:2px 6px;cursor:pointer;opacity:0;transition:opacity .15s}
.favh{position:absolute;top:5px;left:34px;z-index:4;background:rgba(10,4,14,.75);color:#fff;font-size:15px;line-height:1;padding:4px 6px;cursor:grab;touch-action:none;user-select:none;opacity:0;transition:opacity .15s}
.card:hover .favh{opacity:1}
.favghost{position:fixed;z-index:90;pointer-events:none;opacity:.9;transform:rotate(-2deg) scale(1.04);box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.favdragging{opacity:.3}
.favs .card[data-fk]{-webkit-user-drag:none;-webkit-touch-callout:none}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.card:hover .favx,.favx.sure{opacity:1}.favx.sure{background:var(--accent)}
@media (hover:none){.favx,.favh{opacity:.85}}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.card:hover{border-color:var(--ink3)}
.card .meta{padding:7px 8px;border-top:1px solid var(--line)}
.card .meta .tt{font-weight:600;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .meta .ss{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.badge{position:absolute;top:0;right:0;background:var(--bar);color:#fff;font-family:"JetBrains Mono";font-size:12px;padding:3px 7px;z-index:2}
.sline{position:absolute;left:0;bottom:0;right:0;height:4px;background:var(--sc);z-index:2}

/* list page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:28px;display:flex;align-items:center;gap:10px}
.ph h1 i{width:14px;height:14px;background:var(--c);display:inline-block}
.tabs{display:flex;border:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button .n{font-family:"JetBrains Mono";font-size:11px;color:var(--ink3)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c);background:var(--panel2)}
.tabs button:hover{color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--line);border-top:0;background:var(--panel2)}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line2);padding:7px 10px;outline:none}
.toolbar input{flex:1;min-width:160px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{border:0;background:var(--panel);padding:7px 10px;cursor:pointer;color:var(--ink3);display:grid;place-items:center}
.seg button.on{background:var(--ink);color:var(--panel)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
table.lt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);margin-top:14px}
.lt th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);text-align:left;padding:9px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.lt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.lt tr{cursor:pointer}
.lt tbody tr:hover{background:var(--panel2)}
.lt td.st{width:5px;padding:0;background:var(--sc)}
.lt td.num{font-family:"JetBrains Mono";font-size:12px;color:var(--ink3);width:40px}
.lt td.sc{font-family:"JetBrains Mono";font-weight:500;text-align:center;width:64px}
.lt .ti{font-weight:600}
.lt .alt{font-size:12px;color:var(--ink3)}
.lt td.c{text-align:center;white-space:nowrap}
.more{display:flex;justify-content:center;margin-top:16px}
.empty{padding:40px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);margin-top:14px}
.stars{color:var(--film);letter-spacing:1px;white-space:nowrap}

/* writing */
.wtop{display:flex;gap:10px;align-items:stretch;margin-top:16px}
.wtop .tabs{flex:1;min-width:0}
.wtop>.btn{white-space:nowrap}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:14px;margin-top:14px}
.wcard{display:grid;grid-template-columns:108px minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);padding:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.wcard:hover{border-color:var(--story);transform:translateY(-2px)}
.wb{display:flex;flex-direction:column;min-width:0}
.wkick{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink3)}
.wkick .wip{color:var(--story)}
.wcard h3{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;font-size:21px;font-weight:600;letter-spacing:0;margin:3px 0 6px;line-height:1.2}
.wcard p{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink3);margin-top:auto}
.wact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wact .btn{padding:5px 10px;font-size:12.5px}
.wpin.on{color:var(--gold);border-color:var(--gold)}
.wcov{position:relative;aspect-ratio:2/3;background:var(--tc);background-image:linear-gradient(155deg,rgba(255,255,255,.16),rgba(0,0,0,.52));color:#fff;overflow:hidden;box-shadow:inset 5px 0 0 rgba(0,0,0,.24),0 8px 18px -12px rgba(0,0,0,.7);container-type:inline-size}
.wcov::before{content:'';position:absolute;inset:7px 7px 7px 11px;border:1px solid rgba(255,255,255,.3);z-index:1;pointer-events:none}
.wcov .wct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:22px 12px 22px 16px}
.wcov .wct b{font-family:Georgia,'Iowan Old Style',serif;font-weight:600;font-size:clamp(12px,12cqi,19px);line-height:1.18;text-wrap:balance;overflow-wrap:anywhere}
.wcov .wk{position:absolute;left:12px;right:8px;font-size:clamp(7px,6.2cqi,9px);letter-spacing:.2em;text-transform:uppercase;opacity:.78;font-weight:700}
.wcov .wk:first-child{top:clamp(12px,11cqi,18px)}.wcov .wk:last-child{bottom:clamp(12px,11cqi,18px)}
.wcov .orn{font-style:normal;opacity:.6;font-size:clamp(10px,9cqi,14px)}
.wcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.wcov:has(img)::before{display:none}
.wlock{position:absolute;top:6px;right:6px;z-index:3;font-size:11px;background:rgba(0,0,0,.55);padding:1px 5px}
.card .wcov{box-shadow:none}
.drlock{max-width:460px;margin:22px auto 0;text-align:center;padding:26px 22px}
.drlock h3{font-size:18px;margin:6px 0 4px}.drico{font-size:28px}
.drform{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:left}
.drform input[type=password]{border:1px solid var(--line2);background:var(--panel);padding:9px 10px;outline:none}
.drform input[type=password]:focus{border-color:var(--accent)}
.chkline{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink2);font-size:13px}
.chkline input{width:auto!important}
.drtools{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.drbtns{display:flex;gap:6px}
.drtools .drform{grid-column:1/-1;max-width:420px;margin-top:4px}
.drtools .drform[hidden]{display:none}
/* reader */
.rdbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none}
.rdbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--story),var(--accent))}
.reader{max-width:800px;margin:18px auto 0}
.rdtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rdback{font-weight:600;color:var(--ink2)}.rdback:hover{color:var(--story)}
.rdctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rdctl select{border:1px solid var(--line2);background:var(--panel);padding:6px 8px;max-width:230px}
.rdctl .btn{padding:6px 10px}
.rdpaper{background:var(--panel);border:1px solid var(--line);padding:clamp(24px,6vw,64px) clamp(18px,7vw,84px)}
.rdh{text-align:center;margin-bottom:36px}

/* chapter editor */

/* piece editor */

.lst{cursor:pointer;position:relative;outline:none}

/* reorder favourites: drag a card with the mouse, or press and hold it on a phone (the ⠿ grip starts at once) */
function bindFavDrag(k){
  document.querySelectorAll(`[data-fk="${k}"]`).forEach(card=>{
    if(card.__drag)return;card.__drag=1;
    card.querySelectorAll('img').forEach(im=>im.draggable=false);
    card.addEventListener('dragstart',e=>e.preventDefault());
    card.addEventListener('pointerdown',e=>{
      if(!ED.on||e.button>0||e.target.closest('.favx'))return;
      const grip=!!e.target.closest('.favh'),touch=e.pointerType!=='mouse';
      const sx=e.clientX,sy=e.clientY;let started=false,timer=null,lx=sx,ly=sy,ghost,dx,dy,grid=card.parentElement;
      const begin=()=>{started=true;const r=card.getBoundingClientRect();dx=lx-r.left;dy=ly-r.top;
        ghost=card.cloneNode(true);ghost.removeAttribute('data-fk');ghost.className+=' favghost';Object.assign(ghost.style,{width:r.width+'px',left:r.left+'px',top:r.top+'px'});document.body.appendChild(ghost);
        card.classList.add('favdragging');document.body.classList.add('dragging');if(navigator.vibrate&&touch)navigator.vibrate(15)};
      const block=ev=>{if(started||grip)ev.preventDefault()};
      const move=ev=>{lx=ev.clientX;ly=ev.clientY;
        if(!started){const d=Math.hypot(lx-sx,ly-sy);
          if(grip||!touch){if(d>6)begin();else return}
          else{if(d>10){cleanup();}return}}
        ev.preventDefault();
        ghost.style.left=(lx-dx)+'px';ghost.style.top=(ly-dy)+'px';
        const over=[...grid.querySelectorAll('.card[data-fk]')].find(c=>{if(c===card)return false;const b=c.getBoundingClientRect();return lx>b.left&&lx<b.right&&ly>b.top&&ly<b.bottom});
        if(over){const b=over.getBoundingClientRect();grid.insertBefore(card,lx<b.left+b.width/2?over:over.nextSibling);const add=grid.querySelector('.favadd');if(add)grid.appendChild(add)}};
      const cleanup=()=>{clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);window.removeEventListener('touchmove',block)};
      const up=()=>{cleanup();if(!started)return;
        ghost.remove();card.classList.remove('favdragging');document.body.classList.remove('dragging');window.__favDragEnd=Date.now();
        const order=[...grid.querySelectorAll('.card[data-fk]')].map(c=>+c.dataset.i);
        if(order.some((v,i)=>v!==i)){const L=ovFavList(k);saveOvFavs(k,order.map(i=>L[i]),'Reorder overview favourites')}};
      if(touch&&!grip)timer=setTimeout(begin,350);
      if(grip)e.preventDefault();
      window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);window.addEventListener('touchmove',block,{passive:false});
    });
    card.addEventListener('click',e=>{if(Date.now()-(window.__favDragEnd||0)<600){e.stopImmediatePropagation();e.preventDefault()}},true);
    card.addEventListener('contextmenu',e=>{if(card.classList.contains('favdragging'))e.preventDefault()});
  });
}

const SRCN={original:'Original',manga:'Manga','4_koma_manga':'4-koma manga',web_manga:'Web manga',digital_manga:'Digital manga',novel:'Novel',light_novel:'Light novel',visual_novel:'Visual novel',game:'Game',card_game:'Card game',book:'Book',picture_book:'Picture book',radio:'Radio',music:'Music',web_novel:'Web novel',mixed_media:'Mixed media',other:'Other'};

const REPO='SatsugaiDeAtsu/saturn-collections';
const ED={get token(){return store.get('gh_token','')},set token(v){store.set('gh_token',v)},get on(){return !!store.get('edit_on',false)&&!!this.token},set on(v){store.set('edit_on',!!v)}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function ghSave(path,obj,msg){
  const api=`https://api.github.com/repos/${REPO}/contents/${path}`;
  const h={Authorization:'Bearer '+ED.token,Accept:'application/vnd.github+json'};
  const cur=await fetch(api+'?ref=main&_='+Date.now(),{headers:h,cache:'no-store'});
  if(cur.status===401||cur.status===403)throw new Error('GitHub refused the token. Check that it has Contents: read and write for saturn-collections.');
  let sha=cur.ok?(await cur.json()).sha:undefined;
  for(let i=0;i<3;i++){
    const r=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify({message:msg,content:b64(JSON.stringify(obj,null,0)),sha,branch:'main'})});
    if(r.ok)return;
    const e=await r.json().catch(()=>({}));
    const m=/is at ([0-9a-f]{40})/.exec(e.message||'');
    if(r.status===409&&m){sha=m[1];continue}
    throw new Error(e.message||('GitHub error '+r.status));
  }
  throw new Error('GitHub kept reporting a newer version. Try again in a minute.');
}

const ICON_GRID='<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="0" width="6" height="6"/><rect x="8" y="0" width="6" height="6"/><rect x="0" y="8" width="6" height="6"/><rect x="8" y="8" width="6" height="6"/></svg>';

function listPage(cfg){
  const S=state[cfg.key];
  if(!cfg.tabs.some(t=>t[0]===S.tab))S.tab=({anime:'2',manga:'2',games:'Played',books:'read'})[cfg.key]||cfg.tabs[0][0];
  const all=cfg.items();

  const app=$('#app');
  app.innerHTML=`${banner(cfg.key,cfg.title,cfg.sub,cfg.bst?cfg.bst():[],cfg.kicker)}
  <div class="tabs" style="--c:${MED[cfg.key].c}">${cfg.tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${l}<span class="n">${counts[k]}</span></button>`).join('')}</div>
  <div class="toolbar">

/* private drafts: AES-GCM, key from the passphrase with PBKDF2-SHA256 (250k rounds) */
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64u=a=>{const u=new Uint8Array(a);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function dkey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const savedPw=()=>{try{return sessionStorage.getItem('sc_drpw')||store.get('drpw','')}catch(e){return store.get('drpw','')}};
async function drFetch(){if(ED.token){try{return await ghLoad('data/drafts.json')}catch(e){}}const r=await fetch('data/drafts.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return r.json()}
async function unlockDrafts(pw){
  const f=await drFetch();
  if(!f||!f.data){DR={works:[]};DRPW=pw;return}
  const key=await dkey(pw,u8(f.salt));let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(f.iv)},key,u8(f.data))}catch(e){throw new Error('That passphrase did not open them.')}
  DR=JSON.parse(new TextDecoder().decode(pt));DR.works=(DR.works||[]).map(w=>Object.assign(w,{priv:1}));DRPW=pw;
}
async function saveDrafts(pw){
  pw=pw||DRPW;if(!DR||!pw)throw new Error('Unlock your private drafts first.');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await dkey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(DR)));
  await ghSave('data/drafts.json',{v:1,salt:b64u(salt),iv:b64u(iv),data:b64u(ct)},'Update private drafts');
}
async function tryAutoUnlock(){if(DR||!OWNER())return false;const pw=savedPw();if(!pw)return false;try{await unlockDrafts(pw);return true}catch(e){return false}}

    if(c.nodeType!==1||SKIP.test(c.tagName))continue;

function localHits(q){

function hofPeople(){if(HOFP)return HOFP;const out=[],seen=new Set(),H=D.hof||{},F=H.malFavs||{};

  JSON.stringify(H).replace(/"([cp])(\d+)~([^~"]+)(?:~([^"]*))?"/g,(_,k,id,nm,pic)=>{add(k,id,nm,pic);return ''});
  return HOFP=out}
function ownMatch(kind,title,year){
  const n=norm(title);
  if(kind==='anime')return anime.find(a=>norm(a.t)===n||(a.alt&&norm(a.alt)===n));
  if(kind==='films')return films.find(f=>f.n===n&&(!year||!f.y||Math.abs(f.y-year)<=1));
  if(kind==='games')return games.find(g=>norm(g.t)===n);
  if(kind==='manga')return manga.find(x=>norm(x.t)===n||(x.alt&&norm(x.alt)===n));
  if(kind==='books')return books.find(b=>norm(b.t)===n||norm(b.t).startsWith(n+' '));
}

  const own=r=>r.tv?films.concat(seriesOwn).find(f=>String(f.tv)===String(r.tv)):(kind==='characters'||kind==='people')?null:ownMatch(kind,r.t,+r.y);
  if(!res.length){box.innerHTML=`<div class="muted">No ${MED[kind].name.toLowerCase()} found for “${esc(q)}”.</div>${outLinks(kind,q)}`;return}
  box.innerHTML=`${note}<div class="sres" style="margin-top:0">${res.map((r,i)=>{const o=own(r);return `<div class="xr" data-r="${i}">${cover(r.t,r.img)}<div><div class="tt">${esc(r.t)}${o?'<span class="own">In your list</span>':''}${r.tv?'<span class="own" style="background:var(--panel2);color:var(--ink2)">Series</span>':''}</div>${r.alt?`<div class="small muted">${esc(r.alt)}</div>`:''}<div class="small muted">${esc([r.y,r.meta].filter(Boolean).join(' · '))}</div><p>${esc(r.sum)}</p></div></div>`}).join('')}</div>
  ${mode==='claude'?'<div class="note">These results come from Claude\'s knowledge, so very new releases may be missing. Open one to jump to it on '+OUTN[kind]+'.</div>':`<div class="small muted" style="margin-top:8px">Results from ${esc(SRC[kind]||'')}.</div>`}${outLinks(kind,q)}`;
  box.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{const r=res[+el.dataset.r];const o=own(r);if(o){({anime:openAnime,manga:openManga,books:openBook,films:openFilm,games:openGame})[kind](o);return}
    if((kind==='characters'||kind==='people')&&hofPeople().some(p=>p.k===(kind==='people'?'p':'c')&&p.id===r.malId))return openMal({k:kind==='people'?'p':'c',id:r.malId,name:r.t,pic:r.img});
    openExt(kind,r)});
}
function openExt(kind,r){
  const canAdd=OWNER()&&((kind==='anime'||kind==='manga')?!!r.malId:kind==='films'?!!(r.tv||r.mv):(kind==='books'||kind==='games'));
  setTimeout(()=>{const b=$('#x_add');if(!b)return;b.onclick=()=>{
    if(!ED.on){toast(ED.token?'Turn editing on first (pencil button at the top).':'Set up editing first (pencil button at the top).',true);editSetup();return}
    if(kind==='anime'||kind==='manga')return editMal(kind,{malId:r.malId,t:r.t,eps:0,chs:0});
    if(kind==='films'&&r.tv)return editSeries({id:r.tv,t:r.t,y:r.y,img:r.img||'',st:'l'});
    if(kind==='films')return editFilmLocal({__new:1,t:r.t,y:+r.y||0,tmdb:r.mv,img:r.img||'',s:'w'});
    const y=String(r.y||'');
    if(kind==='books')return editBook({__new:1,t:r.t,a:r.a||'',p:r.p||'',y:y,img:r.img||'',st:'toread',sh:[]});
    editGame({__new:1,t:r.t,img:r.img||'',pf:r.pf||[],g:r.g||[],dev:r.dev||[],rel:r.rel||(y?y+'-01-01':''),shelf:'Wish List'});
  }},0);
  const label=kind==='films'&&r.tv?'Series':{anime:'Anime',manga:'Manga',books:'Book',films:'Film',games:'Game',characters:'Character',people:'Person'}[kind];
  modal(kind,label+' · not in your list',`${cover(r.t,r.img)}<div><h2>${esc(r.t)} <span class="muted" style="font-weight:500">${esc(r.y)}</span></h2>${r.alt?`<div class="muted">${esc(r.alt)}</div>`:''}
  <div class="kv">${r.meta?`<div>Details</div><div>${esc(r.meta)}</div>`:''}${r.g&&r.g.length?`<div>Genres</div><div>${r.g.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:''}</div>
  ${r.sum?`<div class="review" style="--c:${MED[kind].c}">${esc(r.sum)}</div>`:''}
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${canAdd?'<button class="btn pri" id="x_add">+ Add to my list</button>':''}<a class="btn${canAdd?'':' pri'}" href="${r.url&&(r.malId||r.gid)?r.url:OUT[kind](r.t)}" target="_blank" rel="noopener">${r.malId?'Open on MyAnimeList':r.gid?'Open on Goodreads':'Find on '+OUTN[kind]} ↗</a>${r.url?`<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Source ↗</a>`:''}</div></div>`);
}

{const US=D.updateStatus||{};const bad=Object.entries(US).filter(([k,v])=>v!=='ok');
$('#foot').innerHTML=`Saturn Collections · data from MyAnimeList, Letterboxd, Goodreads, Grouvee, Medium, TMDB, HowLongToBeat and Wikipedia · last refreshed ${fdate(D.generated)}${OWNER()&&bad.length?`<div style="margin-top:6px;color:var(--s4)">Last update had trouble with: ${bad.map(([k,v])=>`<b>${esc(k)}</b> <span class="muted">(${esc(String(v).slice(0,90))})</span>`).join(' · ')}. The previous data is still shown.</div>`:''}${OWNER()&&(D.repoMB||0)>500?`<div style="margin-top:6px;color:var(--s3)">Storage is at ${D.repoMB} MB. Time for the picture clean-up we talked about.</div>`:''}`;}
syncEditBtn();
malFinish();
go();
})();
</script>
